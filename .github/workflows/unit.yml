name: Run unit tests

on: [push]

permissions: {}

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/uv-setup/
        with:
          dev: false
      - name: Create a dummy data.py
        run: cp data.py-dist data.py
      - run: pytest tests/unit/
      # the flake8 plugins unit tests require the dev dependencies (the
      # editable flake8-plugins package), so they are run in a separate step
      - uses: ./.github/actions/uv-setup/
      - run: pytest flake8_plugins/
